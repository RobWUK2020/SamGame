<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Game for Sam</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --bg-color: #ffe6ea;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.15);
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #e63956;
        }

        button:active {
            transform: scale(0.98);
        }

        .error-message {
            color: red;
            font-size: 0.9em;
            margin-top: -10px;
            margin-bottom: 15px;
            min-height: 20px;
        }

        /* Classes to hide/show sections */
        .hidden {
            display: none !important;
        }

        /* Final Screen Styles */
        .finale-container {
            position: relative;
            display: inline-block;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            max-width: 100%;
        }

        .finale-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .overlay-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            width: 100%;
        }
        
        .progress {
            font-size: 0.8em;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="welcome-screen">
            <h1>Hi Sam! ❤️</h1>
            <p>I made a little game just for you. To get to the end, you'll need to answer a few questions about us. Think you can pass?</p>
            <button onclick="startGame()">Let's Play</button>
        </div>

        <div id="puzzle-screen" class="hidden">
            <h2 id="question-text">Question goes here...</h2>
            <input type="text" id="answer-input" placeholder="Type your answer here..." onkeypress="handleEnter(event)">
            <div id="error-msg" class="error-message"></div>
            <button onclick="checkAnswer()">Submit</button>
            <div class="progress" id="progress-text"></div>
        </div>

        <div id="finale-screen" class="hidden">
            <h1>You did it!</h1>
            <p>Here is your prize...</p>
            
            <div class="finale-container">
                <img src="PUT_YOUR_IMAGE_FILENAME_HERE.jpg" alt="A lovely photo of us" id="couple-photo">
                <div class="overlay-text">I Love You!</div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // EDIT YOUR QUESTIONS AND ANSWERS HERE!
        // ==========================================
        const questions = [
            {
                question: "Where did we go on our very first date?",
                answer: "Sedero Lounge" // She can type "italian restaurant" or " Italian Restaurant ", the code will accept it.
            },
            {
                question: "What is the best Chine in the world",
                answer: "Branksome"
            },
            {
                question: "Who sang the walk in song at our wedding?",
                answer: "Coldplay"
            },
            {
                question: "Finish this sentence: You are the _____ to my Chatter.",
                answer: "shitter"
            }
        ];
        // ==========================================

        let currentQuestionIndex = 0;

        function startGame() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('puzzle-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('answer-input').value = "";
            document.getElementById('error-msg').innerText = "";
            document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('answer-input').focus();
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        }

        function checkAnswer() {
            const userInput = document.getElementById('answer-input').value;
            const correctAnswer = questions[currentQuestionIndex].answer;

            // Clean up both answers to make matching easier (lowercase, remove extra spaces)
            const cleanUserInput = userInput.trim().toLowerCase();
            const cleanCorrectAnswer = correctAnswer.trim().toLowerCase();

            if (cleanUserInput === cleanCorrectAnswer) {
                // Correct!
                currentQuestionIndex++;
                
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    showFinale();
                }
            } else {
                // Incorrect
                document.getElementById('error-msg').innerText = "Not quite! Try again, my love. ❤️";
                // Add a little shake animation class if you want, or just let the text show.
            }
        }

            document.getElementById('puzzle-screen').classList.add('hidden');
            document.getElementById('finale-screen').classList.remove('hidden');
